[project]
name = "collegium-ocr"
version = "0.1.0"
description = "OCR microservice that reads esports match scoreboards for Collegium"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.3",
    "pydantic>=2",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
